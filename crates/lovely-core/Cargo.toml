[package]
name = "lovely-core"
version = "0.9.0"
edition = "2021"

[dependencies]
dirs = { version = "5.0.1", optional = true }
getargs = "0.5.0"
libc = "0.2.153"
libloading = { version = "0.8.3", optional = true }
toml = "0.8.10"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.8"
walkdir = "2.5.0"
wildmatch = "2.3.0"
log = "0.4.21"
regex-cursor = "0.1.4"
regex-lite = "0.1.5"
serde_ignored = "0.1.10"
itertools = "0.13.0"
crop = "0.4.2"
anyhow = "1.0.100"
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }
jiff = "0.2.35"

[features]
default = ["libloading", "dirs", "zip-full"]
zip-full = ["zip/default"]

[lints.rust]
# "switch" is a custom target (skyline)
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("switch"))'] }

[dev-dependencies]
criterion = { version = "0.7", default-features = false }
tempfile = "3"

[[bench]]
name = "patches"
harness = false
